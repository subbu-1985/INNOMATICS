<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .container{
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        label{
            margin-top:10px;
            display:block;
            color:skyblue;
            font-weight:600;
            font-size:15px;
        }
        .a{
            margin-bottom: 10px;
            padding: 5px;
            width: 100%;
        }
        h1{
            text-align:center;
            margin-bottom:20px;
            color: #333;
            font-size:20px;
            padding:3px;
        }
        button{
            width:100%;
            padding:8px;
            background-color:skyblue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }
        button:hover{
            background-color:deepskyblue;
        }
    </style>

    <script>
        function add(){
            var n1=parseInt(document.getElementById("n1").value)
            var n2=parseInt(document.getElementById("n2").value)
            var n3=parseInt(document.getElementById("n3").value)
            var sum=n1+n2+n3;
            alert("The sum of 3 numbers is: "+sum);
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Adding 3 Numbers</h1>

        <label>Enter num1:</label>
        <input type="number" id="n1" class="a">

        <label>Enter num2:</label>
        <input type="number" id="n2" class="a">

        <label>Enter num3:</label>
        <input type="number" id="n3" class="a">

        <button onclick="add()">Add</button>
    </div>
</body>
</html>
