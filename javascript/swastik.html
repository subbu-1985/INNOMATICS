<body>
    <script>
            // *     * * * *

            //       *     *
            // * * * *     *  
            for(let j=1; j<=7; j++){
                for(let i=1; i<=7; i++){
                    if(j==4 || i==4 || j==1&&i>=4 ||j==7&&i<=4  || i==1&&j<=4 || i==7&&j>=4){
                        document.write("*")
                    } else{
                        document.write("&nbsp;&nbsp;")
                    }
                }
                document.write("<br>")
            }

            for(let j=1; j<=7; j++){
                for(let i=1; i<=9; i++){
                    if(j==3||j==5||j+i==6||i-j==4||j+i==12||j==2+i){
                     document.write("*")
                    } else{
                        document.write("&nbsp;&nbsp;")
                    }
                }
                document.write("<br>")
            }
    </script>
