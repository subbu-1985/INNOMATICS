<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            background-color: rgb(83, 237, 41);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow: hidden;
        }
        .container{
            width:220px;
            height:220px;
            display:flex;
            justify-content:center;
            align-items:center;
            perspective:1000px;
        }
        .cube{
            width:200px;
            height:200px;
            position:relative;
            transform-style:preserve-3d;
            animation:cube 8s linear infinite;
        }
        .box{
            position:absolute;
            width:200px;
            height:200px;
            border:3px solid #fff;
            border-radius:10px;
            overflow:hidden;
            backface-visibility:hidden;
            box-shadow:0 0 20px rgba(255,255,255,.5);
        }

        .box img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .box span{
            position:absolute;
            bottom:0;
            left:0;
            width:100%;
            padding:8px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
            color:white;
            background:rgba(0,0,0,0.6);
            font-family:Arial, sans-serif;
        }

        /*
        .front{
            transform:translateZ(100px);
        }


        .back{
            transform:rotateY(180deg) translateZ(100px);
        }


        .right{
            transform:rotateY(90deg) translateZ(100px);
        }


        .left{
            transform:rotateY(-90deg) translateZ(100px);
        }

        .top{
            transform:rotateX(90deg) translateZ(100px);
        }


        .bottom{
            transform:rotateX(-90deg) translateZ(100px);
        }*/
        .front{
            transform:translateZ(100px);
        }

        .back{
            transform:translateZ(-100px) rotateY(180deg);
        }

        .right{
            transform:rotateY(90deg) translateZ(100px);
        }

        .left{
            transform:rotateY(-90deg) translateZ(100px);
        }

        .top{
            transform:rotateX(90deg) translateZ(100px);
        }

        .bottom{
            transform:rotateX(-90deg) translateZ(100px);
        }

        @keyframes cube{
           0%{
               transform:rotateX(0deg) rotateY(0deg);
            }
            25%{
               transform:rotateX(90deg) rotateY(90deg);
            }
            50%{
               transform:rotateX(180deg) rotateY(180deg);
            }
            75%{
               transform:rotateX(270deg) rotateY(270deg);
            }
            100%{
               transform:rotateX(360deg) rotateY(360deg);
            }
        }
    </style>
</body>
    <div class="container">
        <div class="cube">
            <div class="box front">
                <img src="iron.jpeg" alt="Iron Man">
                <span>Iron Man</span>
            </div>
            <div class="box back">
                <img src="spider.jpeg" alt="Spider Man">
                <span>Spider Man</span>
            </div>
            <div class="box left">
                <img src="hulk.jpeg" alt="Hulk">
                <span>Hulk</span>
            </div>
            <div class="box right">
                <img src="thor.jpeg" alt="Thor">
                <span>Thor</span>
            </div>
            <div class="box top">
                <img src="loki.jpeg" alt="Loki">
                <span>Loki</span>
            </div>
            <div class="box bottom">
                <img src="doom.jpeg" alt="Doom">
                <span>DR.Doom</span>
            </div>
        </div>
    </div>
</html>
