    <style>
        .header-right{
            display:flex;
            align-items:center;
            gap:12px;
        }
        .hdr-avatar{
            width:40px;
            height:40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b4a, #0f4c81);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:1.1rem;
            color:#fff;
            text-decoration:none;
            border:2px solid rgba(255,107,74,0.5);
            transition: transform 0.2s,box-shadow 0.2s;
            flex-shrink:0;
        }
        .hdr-avatar:hover{
            transform:scale(1.08);
            box-shadow:0 4px 16px rgba(255, 107, 74, 0.4);
            border-color:#ff6b4a;
        }
        .hdr-avatar-icon{
            line-height:1;
        }
        .hdr-profile-dropdown{
            position:absolute;
            top:calc(100% + 10px);
            right:0;
            background:#fff;
            border-radius:14px;
            box-shadow: 0 20px 50px rgba(15, 30, 60, 0.22);
            width: 240px;
            z-index: 500;
            padding: 6px 0;
            opacity: 0;
            transform: translateY(-8px) scale(0.97);
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
          }
        .hdr-profile:hover .hdr-profile-dropdown,
        .hdr-profile:focus-within .hdr-profile-dropdown{
            opacity:1;
            transform:translateY(0) scale(1);
            pointer-events:auto;
        }
        .hpd-head{
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px 16px;
        }
        .hpd-avatar-lg {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b4a, #0f4c81);
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .hpd-name{
            font-weight:700;
            font-size:0.9rem;
            color:#16213e;
        }
        .hpd-sub{
            font-size:0.75rem;
            color:#6b7280;
        }
        .hdp-divider{
            height:1px;
            background:#f3f4f6;
            margin:4px 0;
        }
        .hpd-item{
            display:block;
            padding:10px 16px;
            font-size:0.87rem;
            color:#374151;
            text-decoration:none;
            transition:background 0.15s color 0.15s;
        }
        .hpd-item:hover{
            background:#faf6ee;
            color:#ff6b4a;
        }
        .hpd-item:hover{
            background:#faf6ee;
            color:#ff6b4a;
        }
        .hpd-logout{
            color:#ef4444 important;
        }
        .hpd-logout:hover{
            background:#fff5f5 !important;
            color:#dc2626 !important;
        }
      
    </style>
